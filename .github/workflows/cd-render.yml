# ═══════════════════════════════════════════════════════════════════════════
# CD — Deploy to Render.com
# Triggers: push to main only (after CI passes)
# Strategy: calls Render deploy hooks for each service
# ═══════════════════════════════════════════════════════════════════════════

name: CD — Deploy to Render

on:
  push:
    branches: [main]

concurrency:
  group: cd-render-${{ github.ref }}
  cancel-in-progress: false   # never skip a production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Wait for CI to pass (using required status checks is preferred, but this
  # acts as an explicit gate when the workflow is in the same repo)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Render deploy: main Docker service (backend + frontend bundled) ──
      - name: Trigger Render deploy — main service
        if: ${{ vars.RENDER_DEPLOY_HOOK_MAIN != '' }}
        run: |
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${{ vars.RENDER_DEPLOY_HOOK_MAIN }}" \
            -o /dev/null \
            -w "HTTP %{http_code}\n"

      # ── Render deploy: ML service (if hosted separately) ─────────────────
      - name: Trigger Render deploy — ML service
        if: ${{ vars.RENDER_DEPLOY_HOOK_ML != '' }}
        run: |
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${{ vars.RENDER_DEPLOY_HOOK_ML }}" \
            -o /dev/null \
            -w "HTTP %{http_code}\n"

      - name: Wait for Render health check
        run: |
          echo "Waiting 60s for Render to spin up containers..."
          sleep 60
          MAX=12
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hireready-9lkl.onrender.com/api/health || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Deploy healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/$MAX — HTTP $STATUS, retrying in 30s..."
            sleep 30
          done
          echo "⚠️  Health check timed out; check Render dashboard"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # Notify on failure
  # ─────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Send failure summary
        run: |
          echo "::error::Deployment to Render FAILED for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
